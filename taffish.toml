[package]
name = "semibin2"
kind = "tool"
version = "2.4.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/semibin2"

[command]
name = "taf-semibin2"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/semibin2:2.4.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["metagenomics", "binning", "MAG", "assembly", "deep-learning"]
keywords = ["SemiBin", "SemiBin2", "metagenomic-binning", "MAG", "binning", "PyTorch", "abundance", "contigs", "self-supervised-learning"]
description = "Semi-supervised and self-supervised metagenomic binning with SemiBin2."

[upstream]
name = "SemiBin"
type = "github"
repo = "BigDataBiology/SemiBin"
homepage = "https://semibin.readthedocs.io/"
manual = "https://semibin.readthedocs.io/en/latest/"
release_url = "https://github.com/BigDataBiology/SemiBin/releases/tag/v2.4.1"
downloads = "bioconda::semibin=2.4.1=pyhdfd78af_0; https://github.com/BigDataBiology/SemiBin/releases/download/v2.4.1/semibin-2.4.1-py3-none-any.whl"
version = "2.4.1"
commit = "932d98b13761c3f64a928e1b74e41649d3c8bf14"
license = "MIT"
citation = "Pan et al. 2022, SemiBin: metagenomic binning through contrastive learning; Pan et al. 2023, SemiBin2: self-supervised contrastive learning leads to better MAGs"
doi = "10.1038/s41467-022-29843-y; 10.1093/bioinformatics/btad209"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 240
exist = ["SemiBin2", "python", "python3", "samtools", "bedtools", "hmmsearch", "hmmscan", "hmmpress", "prodigal", "sh", "grep", "gzip"]
test = ["python -c 'import importlib.metadata as md; import SemiBin, torch, numpy, pandas, sklearn, igraph, requests, safetensors, tqdm, numexpr; assert md.version(\"SemiBin\") == \"2.4.1\"; print(md.version(\"SemiBin\"))' | grep -Fx '2.4.1' >/dev/null", "python -c 'from pathlib import Path; import SemiBin; expected = {\"built_environment_model.pt\", \"cat_gut_model.pt\", \"chicken_caecum_model.pt\", \"dog_gut_model.pt\", \"global_model.pt\", \"human_gut_model.pt\", \"human_oral_model.pt\", \"mouse_gut_model.pt\", \"ocean_model.pt\", \"pig_gut_model.pt\", \"soil_model.pt\", \"wastewater_model.pt\"}; found = {path.name for path in (Path(next(iter(SemiBin.__path__))) / \"models\").glob(\"*.pt\")}; assert found == expected; print(len(found))' | grep -Fx '12' >/dev/null", "SemiBin2 --version 2>&1 | grep -Fx '2.4.1' >/dev/null && SemiBin2 --help 2>&1 | grep -F 'single_easy_bin' >/dev/null && SemiBin2 --help 2>&1 | grep -F 'concatenate_fasta' >/dev/null && SemiBin2 --help 2>&1 | grep -F 'install-skills' >/dev/null", "SemiBin2 single_easy_bin --help 2>&1 | grep -F -- '--environment' >/dev/null && SemiBin2 multi_easy_bin --help 2>&1 | grep -F -- '--input-fasta' >/dev/null && SemiBin2 concatenate_fasta --help 2>&1 | grep -F -- '--input-fasta' >/dev/null && SemiBin2 install-skills --help 2>&1 | grep -F -- '--skills-dir' >/dev/null && SemiBin2 check_install --help 2>&1 | grep -F 'check' >/dev/null", "SemiBin2 check_install 2>&1 | grep -F 'Installation OK' >/dev/null", "/opt/semibin2/share/testdata/semibin2-smoke-concat.sh", "/opt/semibin2/share/testdata/semibin2-smoke-install-skills.sh", "/opt/semibin2/share/testdata/semibin2-smoke-short-contigs.sh"]
