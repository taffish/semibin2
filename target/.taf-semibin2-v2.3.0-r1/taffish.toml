[package]
name = "semibin2"
kind = "tool"
version = "2.3.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["metagenomics", "binning", "MAG", "assembly", "deep-learning"]
keywords = ["SemiBin", "SemiBin2", "metagenomic-binning", "MAG", "binning", "PyTorch", "abundance", "contigs", "self-supervised-learning"]
description = "Semi-supervised and self-supervised metagenomic binning with SemiBin2."

[repository]
url = "https://github.com/taffish/semibin2"

[command]
name = "taf-semibin2"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/semibin2:2.3.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[upstream]
name = "SemiBin"
type = "github"
repo = "BigDataBiology/SemiBin"
homepage = "https://semibin.readthedocs.io/"
manual = "https://semibin.readthedocs.io/en/latest/"
release_url = "https://github.com/BigDataBiology/SemiBin/releases/tag/v2.3.0"
downloads = "bioconda::semibin=2.3.0; pypi::SemiBin==2.3.0; https://github.com/BigDataBiology/SemiBin/archive/refs/tags/v2.3.0.tar.gz"
version = "2.3.0"
license = "MIT"
citation = "Pan et al. 2022, SemiBin: metagenomic binning through contrastive learning; Pan et al. 2023, SemiBin2: self-supervised contrastive learning leads to better MAGs"
doi = "10.1038/s41467-022-29843-y; 10.1093/bioinformatics/btad209"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 240
exist = ["SemiBin2", "python", "python3", "samtools", "bedtools", "hmmsearch", "hmmscan", "hmmpress", "prodigal", "sh", "grep", "gzip"]
test = ["python -c 'import importlib.metadata as md; import SemiBin, torch, numpy, pandas, sklearn, igraph, requests, safetensors, tqdm, numexpr; assert md.version(\"SemiBin\") == \"2.3.0\"; print(md.version(\"SemiBin\"))' | grep -Fx '2.3.0' >/dev/null", "SemiBin2 --version 2>&1 | grep -F '2.3.0' >/dev/null && SemiBin2 --help 2>&1 | grep -F 'single_easy_bin' >/dev/null && SemiBin2 --help 2>&1 | grep -F 'concatenate_fasta' >/dev/null", "SemiBin2 single_easy_bin --help 2>&1 | grep -F -- '--environment' >/dev/null && SemiBin2 multi_easy_bin --help 2>&1 | grep -F -- '--input-fasta' >/dev/null && SemiBin2 concatenate_fasta --help 2>&1 | grep -F -- '--input-fasta' >/dev/null && SemiBin2 check_install --help 2>&1 | grep -F 'check' >/dev/null", "SemiBin2 check_install 2>&1 | grep -F 'SemiBin2' >/dev/null", "/opt/semibin2/share/testdata/semibin2-smoke-concat.sh"]
